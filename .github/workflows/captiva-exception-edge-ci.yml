name: Captiva manager review Edge Function typecheck

on:
  push:
    branches:
      - feature/captiva-exception-reviews
      - feature/captiva-secure-ingest
    paths:
      - "supabase/functions/pos-exception-review/**"
      - "supabase/functions/pos-captiva-ingest/**"
      - "supabase/functions/pos-captiva-briefing/**"
      - ".github/workflows/captiva-exception-edge-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/pos-exception-review/**"
      - ".github/workflows/captiva-exception-edge-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check reviewed endpoint (no deployment)
        run: deno check supabase/functions/pos-exception-review/index.ts supabase/functions/pos-captiva-ingest/index.ts supabase/functions/pos-captiva-briefing/index.ts
